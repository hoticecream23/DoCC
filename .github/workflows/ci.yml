name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: bandit
        run: bandit -q -r baseline cascade demo scripts
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --tb=short -rfE 2>&1 | tee pytest.log
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          # Surface failures as annotations so they are readable without opening the log.
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | sed 's/^/::error::/'
          tail -3 pytest.log | sed 's/^/::error::/'
          { echo '```'; grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -80; tail -5 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
