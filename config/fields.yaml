# Field definitions. Strategies run in listed order, first hit wins per field.
#
# strategies: pattern | anchor | positional
#   pattern    - regex candidates, then a validator function confirms
#   anchor     - find a label keyword, take the nearest value of expected type
#   positional - fixed region on a registered template, needs bboxes
#
# validator names map to baseline.metadata.VALIDATORS
# normalizer names map to baseline.metadata.NORMALIZERS
version: 1
normalizer_version: "1.1.0"

fields:
  - name: pan
    description: "Indian Permanent Account Number: five letters, four digits, one letter."
    type: id
    normalizer: id_upper
    multi: true
    strategies: [pattern]
    pattern:
      regex: '\b([A-Z]{5}[0-9]{4}[A-Z])\b'
      validator: pan
      confidence_validated: 1.0

  - name: aadhaar
    description: "Indian Aadhaar number: 12 digits, often printed in groups of four."
    type: id
    normalizer: digits_only
    strategies: [pattern]
    pattern:
      regex: '\b([2-9][0-9]{3}[\s-]?[0-9]{4}[\s-]?[0-9]{4})\b'
      validator: aadhaar
      confidence_validated: 1.0

  - name: gstin
    description: "Indian GST identification number, 15 characters."
    type: id
    normalizer: id_upper
    multi: true
    strategies: [pattern]
    pattern:
      regex: '\b([0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z][Z][0-9A-Z])\b'
      validator: gstin
      confidence_validated: 1.0

  - name: ifsc
    description: "Indian bank branch IFSC code, 11 characters."
    type: id
    normalizer: id_upper
    strategies: [pattern]
    pattern:
      regex: '\b([A-Z]{4}0[A-Z0-9]{6})\b'
      validator: ifsc
      confidence_validated: 1.0

  - name: card_number
    description: "Payment card number, 16 digits."
    type: id
    normalizer: digits_only
    strategies: [pattern]
    pattern:
      regex: '\b([0-9]{4}(?:[\s-]?[0-9]{4}){3})\b'
      validator: luhn
      confidence_validated: 1.0

  - name: email
    description: "An email address printed on the document."
    type: text
    normalizer: lower_strip
    strategies: [pattern]
    pattern:
      regex: '\b([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})\b'
      validator: email
      confidence_validated: 0.95
      confidence_unvalidated: 0.4

  - name: phone
    description: "A phone number printed on the document."
    type: text
    normalizer: digits_only
    strategies: [pattern]
    pattern:
      regex: '(?:\+91[\s-]?)?\b([6-9][0-9]{9})\b'
      validator: phone_in
      confidence_validated: 0.9
      confidence_unvalidated: 0.35

  - name: invoice_number
    description: "The document's own invoice, bill, receipt or order reference number."
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: text
    normalizer: upper_strip
    strategies: [anchor, pattern]
    anchor:
      window: 60
      direction: after
      # The value is the first token after the label, past any : . # and
      # line breaks, and it carries a digit. Searching the whole window read
      # the next label instead (INVOICE NO / DATE gave DATE, INV NO: / QTY
      # gave QTY, BILL NO / CASHIER gave CASHIER). The optional short prefix
      # keeps CS 24358 and CR 1804/1627 reading their number.
      value_regex: '^[\s:.#-]*(?:[A-Z]{1,3} )?((?=[A-Z0-9/_-]*[0-9])[A-Z0-9][A-Z0-9/_-]{2,30})'
      # A label glued to a word is another label: LPO NO is a customer's
      # order, not this document's number.
      reject_before: '[a-z]$'
      labels:
        - {text: "invoice no", specificity: 1.0}
        - {text: "invoice number", specificity: 1.0}
        - {text: "invoice #", specificity: 0.95}
        - {text: "invoice#", specificity: 0.95}
        # A payment receipt that names the invoice it settles carries that
        # invoice's number; the graph links the two on it. Its own receipt
        # number is the fallback, so it ranks below every invoice label.
        - {text: "against invoice", specificity: 1.0}
        - {text: "receipt no", specificity: 0.9}
        - {text: "receipt number", specificity: 0.9}
        - {text: "receipt #", specificity: 0.9}
        - {text: "receipt#", specificity: 0.9}
        - {text: "doc no", specificity: 0.85}   # SROIE receipts: DOC NO. CS00110840
        - {text: "doc #", specificity: 0.85}
        - {text: "inv#", specificity: 0.8}
        - {text: "po no", specificity: 0.95}
        - {text: "po number", specificity: 0.95}
        - {text: "bill no", specificity: 0.85}
        - {text: "inv no", specificity: 0.8}
        # Yaumi prints its reference as TAX INVOICE ~ CASH # 13333469, or
        # CREDIT # for credit sales. 123 of its 140 scans carry one of the two,
        # and neither phrase appears anywhere else in the client corpus.
        - {text: "cash #", specificity: 0.9}
        - {text: "credit #", specificity: 0.9}
    pattern:
      # Capture the whole reference including its prefix. Grouping only the
      # tail turned INV-2024-0042 into 2024-0042.
      #
      # The lookahead requires a digit somewhere in the reference. Without it
      # this pattern matched the word INVOICE, which is printed on nearly every
      # invoice: INV plus OICE clears the {3,20} tail. So did POLICY, PORTAL,
      # POSTAL, POWER, BILLING and INVOICES. Measured on the client corpus that
      # was a 69.2% hit rate against a 1.3% validation rate, and 7 of the 8
      # values the pattern layer actually emitted were ordinary English words.
      # A real invoice or PO reference always carries a digit.
      regex: '\b((?:INV|BILL|PO)[/-]?(?=[A-Z0-9/-]*[0-9])[A-Z0-9/-]{3,20})\b'
      validator: invoice_number
      confidence_validated: 0.7
      confidence_unvalidated: 0.4

  - name: invoice_date
    description: "The date the invoice, receipt or order was issued."
    classes: [invoice, receipt, purchase_order, bank_statement]   # only run on these document classes
    type: date
    normalizer: date_iso
    strategies: [anchor, pattern]
    anchor:
      window: 60
      direction: after
      # Year first, day first with / . or -, and a month name in the middle.
      # SROIE prints 27/MAR/2018, 28-FEB-2018, 22 MAR 18, 2018/03/27 and
      # 23.03.18, and none of them used to match. The (?![0-9]) stops a two
      # digit year being cut out of a longer number.
      value_regex: &date_value '([0-9]{4}[/.-][0-9]{1,2}[/.-][0-9]{1,2}|[0-9]{1,2}[/.-][0-9]{1,2}[/.-](?:[0-9]{4}|[0-9]{2})(?![0-9])|[0-9]{1,2}[\s/-]*(?i:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[A-Za-z]{0,6}\.?,?[\s/-]*(?:[0-9]{4}|[0-9]{2})(?![0-9]))'
      labels:
        - {text: "invoice date", specificity: 1.0}
        - {text: "date of invoice", specificity: 1.0}
        - {text: "bill date", specificity: 0.9}
        - {text: "dated", specificity: 0.7}
        - {text: "date", specificity: 0.55}
    pattern:
      # Unlabelled dates need a four digit year, or too many fractions and
      # references read as dates.
      regex: '\b([0-9]{4}[/.-][0-9]{1,2}[/.-][0-9]{1,2}|[0-9]{1,2}[/.-][0-9]{1,2}[/.-][0-9]{4}|[0-9]{1,2}[\s/-]*(?i:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[A-Za-z]{0,6}\.?,?[\s/-]*[0-9]{4})\b'
      validator: date_sane
      confidence_validated: 0.6
      confidence_unvalidated: 0.3

  - name: due_date
    description: "The date payment is due."
    classes: [invoice, purchase_order]   # only run on these document classes
    type: date
    normalizer: date_iso
    strategies: [anchor]
    anchor:
      window: 60
      direction: after
      value_regex: *date_value
      labels:
        - {text: "due date", specificity: 1.0}
        - {text: "payment due", specificity: 0.95}
        - {text: "payable by", specificity: 0.85}

  - name: total_amount
    description: "The final amount payable, including tax."
    classes: [invoice, receipt, purchase_order, salary_slip]   # only run on these document classes
    type: amount
    normalizer: currency
    strategies: [anchor]
    anchor:
      window: 80
      direction: after
      # A number followed by % is a rate, never the total ("GST @6%").
      value_regex: '(?:(?:INR|Rs\.?|₹|\$)\s*)?([0-9]{1,3}(?:,[0-9]{2,3})+(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)(?![0-9.]*\s*%)'
      # Refuse a label hit whose own line names a different quantity:
      # "sub total", "tax total", "total qty", "total gst", "total (excl gst)".
      reject_before: '(?:sub|tax|gst|in)[\s-]*$'
      reject_after: '^\s*(?:\(?\s*excl|\(?\s*exclusive|\(?\s*excluding|qty|quantity|items?\b|savings?|discount|gst\s*(?:\(|:|$)|tax\b|includes|[0-9]+%\s*supplies|sales\s*\(?\s*excl|\(\s*[a-z]\s*\))'
      labels:
        - {text: "grand total", specificity: 1.0}
        - {text: "total amount due", specificity: 1.0}
        - {text: "amount payable", specificity: 0.95}
        - {text: "net payable", specificity: 0.95}
        - {text: "total payable", specificity: 0.95}
        - {text: "amt payable", specificity: 0.95}
        - {text: "amount due", specificity: 0.95}
        - {text: "final total", specificity: 0.95}
        - {text: "nett total", specificity: 0.9}
        - {text: "net total", specificity: 0.9}
        - {text: "net salary", specificity: 0.9}
        - {text: "total amount", specificity: 0.9}
        - {text: "amount paid", specificity: 0.9}    # receipts state it this way
        - {text: "net pay", specificity: 0.9}        # salary slips do
        - {text: "net amount", specificity: 0.85}
        - {text: "total", specificity: 0.6}

  - name: tax_amount
    description: "The total tax charged."
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: amount
    normalizer: currency
    strategies: [anchor]
    anchor:
      window: 80
      direction: after
      value_regex: '(?:(?:INR|Rs\.?|₹|\$)\s*)?([0-9]{1,3}(?:,[0-9]{2,3})+(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)'
      labels:
        - {text: "total tax", specificity: 1.0}
        - {text: "tax amount", specificity: 0.95}
        - {text: "gst amount", specificity: 0.95}
        - {text: "cgst", specificity: 0.8}
        - {text: "sgst", specificity: 0.8}
        - {text: "igst", specificity: 0.8}

  - name: account_number
    description: "A bank account number."
    type: id
    normalizer: digits_only
    strategies: [anchor]
    anchor:
      window: 60
      direction: after
      value_regex: '([0-9]{9,18})'
      labels:
        - {text: "account number", specificity: 1.0}
        - {text: "account no", specificity: 1.0}
        - {text: "a/c no", specificity: 0.9}
        - {text: "bank account", specificity: 0.85}

  - name: vendor_name
    description: "The business that issued the document and is to be paid."
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: text
    normalizer: text_norm
    # Receipts carry no "sold by" label: the vendor is the header line.
    # The pattern runs only when no label hits.
    strategies: [anchor, pattern]
    pattern:
      # The first line with letters, after at most three lines that are
      # numbers only, a date, or a "tax invoice" / "receipt" / "copy" banner.
      # Never a tel/fax/gst/address line. Stops before a "(reg no)" suffix.
      # The line must be all capitals, as a printed shop header is, and the
      # document must say total, amount, invoice or receipt somewhere. That
      # keeps it off OCR noise and off ID cards, which run every field when
      # the class is unknown.
      # ponytail: one header line only; a name that wraps onto line two
      # ("SECURE PARKING / CORPORATION S/B") comes out truncated.
      regex: '(?im)\A(?:[ \t]*(?:[^a-z\n]*|[^\n]*\b(?:tax[ \t]*invoice|invoice|receipt|copy)\b[^\n]*|[0-9]{1,2}[ /.-](?:[0-9]{1,2}|[a-z]{3,9})[ /.-][0-9]{2,4}\b[^\n]*|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[ \t]+[0-9]{4}[ \t]*)\n){0,3}+[ \t]*(?![^\n]*\b(?:invoice|receipt|copy)\b)(?!(?:tel|fax|gst|no|lot|jalan)\b)(?-i:([A-Z0-9&][^\na-z(]*?[A-Z][^\na-z(]*?))[ \t]*(?:\(|$)(?=[\s\S]*\b(?:total|amount|invoice|receipt)\b)'
      confidence_unvalidated: 0.5
    anchor:
      window: 90
      direction: after
      value_regex: '([A-Z][A-Za-z&.,''-]*(?:[ 	]+[A-Z][A-Za-z&.,''-]*){0,5})'
      labels:
        - {text: "sold by", specificity: 1.0}
        - {text: "supplier name", specificity: 1.0}
        - {text: "vendor name", specificity: 1.0}
        - {text: "billed from", specificity: 0.9}
        - {text: "seller", specificity: 0.8}

  - name: buyer_name
    description: "The customer the document is addressed to or billed to."
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: text
    normalizer: text_norm
    strategies: [anchor]
    anchor:
      window: 90
      direction: after
      value_regex: '([A-Z][A-Za-z&.,''-]*(?:[ 	]+[A-Z][A-Za-z&.,''-]*){0,5})'
      labels:
        - {text: "bill to", specificity: 1.0}
        - {text: "billed to", specificity: 1.0}
        - {text: "customer name", specificity: 0.95}
        - {text: "ship to", specificity: 0.8}

  # Court documents. Every judgment in both corpora comes from indiankanoon.org,
  # which opens each one with the same title line:
  #   "<petitioner> vs <respondent> on <day> <Month>, <year>"
  # The title wraps onto a second line at most, anywhere in it. The \A anchor
  # means only the start of the document can match, never a case cited in the body.
  # ponytail: title patterns are indiankanoon only. A judgment from another
  # source falls through to the header patterns below or returns nothing.
  - name: petitioner
    description: "The first named party bringing the case."
    classes: [court_document]
    type: text
    normalizer: text_norm
    strategies: [pattern]
    pattern:
      regex: '\A\s*([^\n]+?(?:\n[^\n]+?)?)\s+vs\.?\s+[^\n]+?(?:\n[^\n]+?)?\s+on\s+[0-9]{1,2}\s+[A-Za-z]+,\s+[0-9]{4}'
      confidence_unvalidated: 0.9

  - name: respondent
    description: "The first named party the case is brought against."
    classes: [court_document]
    type: text
    normalizer: text_norm
    strategies: [pattern]
    pattern:
      regex: '\A\s*[^\n]+?(?:\n[^\n]+?)?\s+vs\.?\s+([^\n]+?(?:\n[^\n]+?)?)\s+on\s+[0-9]{1,2}\s+[A-Za-z]+,\s+[0-9]{4}'
      confidence_unvalidated: 0.9

  - name: judgment_date
    description: "The date the judgment was delivered."
    classes: [court_document]
    type: date
    normalizer: date_iso
    strategies: [pattern]
    pattern:
      # 1 January 1800 is the date indiankanoon prints when it has none.
      regex: '\A\s*[^\n]+?(?:\n[^\n]+?)?\s+vs\.?\s+[^\n]+?(?:\n[^\n]+?)?\s+on\s+([0-9]{1,2}\s+[A-Za-z]+,\s+(?!1800\b)[0-9]{4})'
      validator: date_sane
      validator_args: {min_year: 1900}
      confidence_validated: 0.95
      confidence_unvalidated: 0.3

  - name: bench
    description: "The judges who heard the case."
    classes: [court_document]
    type: text
    normalizer: text_norm
    strategies: [pattern]
    pattern:
      # "Bench: A, B" on one line, or the older "BENCH:" with the names below.
      # A line ending in a colon is the next heading ("ACT:"), not a name.
      regex: '(?m)^[ \t]*Bench:[ \t]*\n?[ \t]*([A-Z][^\n]*[^:\n])[ \t]*$'
      ignorecase: true
      confidence_unvalidated: 0.9

  - name: court
    description: "The court that delivered the judgment."
    classes: [court_document]
    type: text
    normalizer: upper_strip
    strategies: [pattern]
    pattern:
      # "IN THE SUPREME COURT OF INDIA", "In The High Court At Calcutta",
      # "IN THE HIGH COURT OF DELHI AT NEW DELHI", "THE GAUHATI HIGH COURT".
      # The name must fill its whole line. A court named in running text, like
      # "the Bombay High Court held", never does.
      # ponytail: Supreme Court and High Courts only. Tribunals and lower courts
      # return nothing. Add their header shapes when a corpus needs them.
      regex: '(?m)^[^A-Za-z\n]*(?:IN[ \t]+)?THE[ \t]+((?:SUPREME|HIGH)[ \t]+COURT[ \t]+(?:OF|AT)(?:[ \t]+[A-Za-z&]+){1,5}|[A-Za-z]+[ \t]+HIGH[ \t]+COURT)[ \t]*$'
      ignorecase: true
      confidence_unvalidated: 0.8

  - name: citation
    description: "The law report citation of the judgment."
    classes: [court_document]
    type: text
    normalizer: upper_strip
    strategies: [anchor, pattern]
    anchor:
      # Only the first of the equivalent citations. The list can run to twenty.
      window: 80
      direction: after
      value_regex: '[ \t]*([^,\n]+)'
      labels:
        - {text: "equivalent citations:", specificity: 0.95}
    pattern:
      # Neutral citation, e.g. "2026:KHC:5069" or "2026:GAU-NL:332-DB".
      regex: '\b((?:19|20)[0-9]{2}:[A-Z]+(?:-[A-Z]+)?:[0-9]+(?:-DB)?)\b'
      confidence_unvalidated: 0.9

  - name: case_number
    description: "The court's own case, appeal or petition number."
    classes: [court_document]
    type: text
    normalizer: upper_strip
    strategies: [anchor, pattern]
    anchor:
      window: 60
      direction: after
      value_regex: '[ \t]*:?\s*([A-Za-z][^\n]*?[0-9]+[^\n]*?(?:of[ \t]+|/)[0-9]{4})'
      labels:
        - {text: "case no", specificity: 0.95}
    pattern:
      # Case sensitive, so running text like "to a civil suit" is not swept in.
      # Two shapes:
      #   <TYPE> No. <n> of <year>   W.P. No. 26952 (W) of 2006, CIVIL APPEAL NO.733 OF 2012
      #   <TYPE> <n>/<year>          ITA 218/2017, O.M.P. (COMM) 463/2023 (Delhi)
      # In the first shape TYPE is W.P., WP(LODG), WPSR, CCC, MP, or up to two
      # capitalised words before Appeal, Suit, Petition, Application or Case.
      # Earliest match wins, and the header comes before any case it cites.
      regex: '\b((?:W\.?[ \t]?P\.?(?:[ \t]?\([A-Z]+\))?|WPSR|CCC|MP|(?:[A-Z][A-Za-z]+[ \t]+){0,2}(?:APPEAL|SUIT|PETITION|APPLICATION|CASE|Appeal|Suit|Petition|Application|Case)(?:[ \t]*\([A-Z.]+\))?)[ \t]+(?:[Nn][Oo]\.?[ \t]*:?[ \t]*)?[0-9]+(?:[ \t]*\([A-Z-]+\))?[ \t]+(?:of|OF)[ \t]+[0-9]{4}|(?!NO\b)[A-Z][A-Z.]*(?:[ \t]*\([A-Z]+\))?[ \t]+[0-9]+/[0-9]{4})'
      confidence_unvalidated: 0.8

# Options handed to the normalizers. Keeps vocabulary out of the code.
normalizer_options:
  date_iso:
    dayfirst: true          # Indian corpora are dd/mm/yyyy
  currency:
    default: INR
    lookbehind: 20          # chars before the number to sniff for a symbol
    symbols:
      "₹": INR
      "Rs.": INR
      "Rs": INR
      "INR": INR
      "$": USD
      "USD": USD
      "€": EUR
      "EUR": EUR
      "£": GBP
      "GBP": GBP
      "AED": AED
      "SGD": SGD
      "JPY": JPY

# Positional templates. Empty is fine, the strategy just never fires.
# region is [x0, y0, x1, y1] as a fraction of page size.
templates: []
