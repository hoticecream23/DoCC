# Field definitions. Strategies run in listed order, first hit wins per field.
#
# strategies: pattern | anchor | positional
#   pattern    - regex candidates, then a validator function confirms
#   anchor     - find a label keyword, take the nearest value of expected type
#   positional - fixed region on a registered template, needs bboxes
#
# validator names map to baseline.metadata.VALIDATORS
# normalizer names map to baseline.metadata.NORMALIZERS
version: 1
normalizer_version: "1.0.0"

fields:
  - name: pan
    type: id
    normalizer: id_upper
    multi: true
    strategies: [pattern]
    pattern:
      regex: '\b([A-Z]{5}[0-9]{4}[A-Z])\b'
      validator: pan
      confidence_validated: 1.0
      confidence_unvalidated: 0.55

  - name: aadhaar
    type: id
    normalizer: digits_only
    strategies: [pattern]
    pattern:
      regex: '\b([2-9][0-9]{3}[\s-]?[0-9]{4}[\s-]?[0-9]{4})\b'
      validator: aadhaar
      confidence_validated: 1.0
      confidence_unvalidated: 0.4

  - name: gstin
    type: id
    normalizer: id_upper
    multi: true
    strategies: [pattern]
    pattern:
      regex: '\b([0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z][Z][0-9A-Z])\b'
      validator: gstin
      confidence_validated: 1.0
      confidence_unvalidated: 0.5

  - name: ifsc
    type: id
    normalizer: id_upper
    strategies: [pattern]
    pattern:
      regex: '\b([A-Z]{4}0[A-Z0-9]{6})\b'
      validator: ifsc
      confidence_validated: 1.0
      confidence_unvalidated: 0.5

  - name: card_number
    type: id
    normalizer: digits_only
    strategies: [pattern]
    pattern:
      regex: '\b([0-9]{4}(?:[\s-]?[0-9]{4}){3})\b'
      validator: luhn
      confidence_validated: 1.0
      confidence_unvalidated: 0.35

  - name: email
    type: text
    normalizer: lower_strip
    strategies: [pattern]
    pattern:
      regex: '\b([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})\b'
      validator: email
      confidence_validated: 0.95
      confidence_unvalidated: 0.4

  - name: phone
    type: text
    normalizer: digits_only
    strategies: [pattern]
    pattern:
      regex: '(?:\+91[\s-]?)?\b([6-9][0-9]{9})\b'
      validator: phone_in
      confidence_validated: 0.9
      confidence_unvalidated: 0.35

  - name: invoice_number
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: text
    normalizer: upper_strip
    strategies: [anchor, pattern]
    anchor:
      window: 60
      direction: after
      value_regex: '([A-Z0-9][A-Z0-9/_-]{2,30})'
      labels:
        - {text: "invoice no", specificity: 1.0}
        - {text: "invoice number", specificity: 1.0}
        - {text: "invoice #", specificity: 0.95}
        - {text: "bill no", specificity: 0.85}
        - {text: "inv no", specificity: 0.8}
    pattern:
      regex: '\b(?:INV|BILL)[/-]?([A-Z0-9/-]{3,20})\b'
      validator: invoice_number
      confidence_validated: 0.7
      confidence_unvalidated: 0.4

  - name: invoice_date
    classes: [invoice, receipt, purchase_order, bank_statement]   # only run on these document classes
    type: date
    normalizer: date_iso
    strategies: [anchor, pattern]
    anchor:
      window: 60
      direction: after
      value_regex: '([0-9]{1,2}[/-][0-9]{1,2}[/-][0-9]{2,4}|[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2}\s+[A-Za-z]{3,9},?\s+[0-9]{4})'
      labels:
        - {text: "invoice date", specificity: 1.0}
        - {text: "date of invoice", specificity: 1.0}
        - {text: "bill date", specificity: 0.9}
        - {text: "dated", specificity: 0.7}
        - {text: "date", specificity: 0.55}
    pattern:
      regex: '\b([0-9]{1,2}[/-][0-9]{1,2}[/-][0-9]{4})\b'
      validator: date_sane
      confidence_validated: 0.6
      confidence_unvalidated: 0.3

  - name: due_date
    classes: [invoice, purchase_order]   # only run on these document classes
    type: date
    normalizer: date_iso
    strategies: [anchor]
    anchor:
      window: 60
      direction: after
      value_regex: '([0-9]{1,2}[/-][0-9]{1,2}[/-][0-9]{2,4}|[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2}\s+[A-Za-z]{3,9},?\s+[0-9]{4})'
      labels:
        - {text: "due date", specificity: 1.0}
        - {text: "payment due", specificity: 0.95}
        - {text: "payable by", specificity: 0.85}

  - name: total_amount
    classes: [invoice, receipt, purchase_order, salary_slip]   # only run on these document classes
    type: amount
    normalizer: currency
    strategies: [anchor]
    anchor:
      window: 80
      direction: after
      value_regex: '(?:(?:INR|Rs\.?|₹|\$)\s*)?([0-9]{1,3}(?:,[0-9]{2,3})+(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)'
      labels:
        - {text: "grand total", specificity: 1.0}
        - {text: "total amount due", specificity: 1.0}
        - {text: "amount payable", specificity: 0.95}
        - {text: "net payable", specificity: 0.95}
        - {text: "total amount", specificity: 0.9}
        - {text: "net amount", specificity: 0.85}
        - {text: "total", specificity: 0.6}

  - name: tax_amount
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: amount
    normalizer: currency
    strategies: [anchor]
    anchor:
      window: 80
      direction: after
      value_regex: '(?:(?:INR|Rs\.?|₹|\$)\s*)?([0-9]{1,3}(?:,[0-9]{2,3})+(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?)'
      labels:
        - {text: "total tax", specificity: 1.0}
        - {text: "tax amount", specificity: 0.95}
        - {text: "gst amount", specificity: 0.95}
        - {text: "cgst", specificity: 0.8}
        - {text: "sgst", specificity: 0.8}
        - {text: "igst", specificity: 0.8}

  - name: account_number
    type: id
    normalizer: digits_only
    strategies: [anchor]
    anchor:
      window: 60
      direction: after
      value_regex: '([0-9]{9,18})'
      labels:
        - {text: "account number", specificity: 1.0}
        - {text: "account no", specificity: 1.0}
        - {text: "a/c no", specificity: 0.9}
        - {text: "bank account", specificity: 0.85}

  - name: vendor_name
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: text
    normalizer: text_norm
    strategies: [anchor]
    anchor:
      window: 90
      direction: after
      value_regex: '([A-Z][A-Za-z&.,''-]*(?:[ 	]+[A-Z][A-Za-z&.,''-]*){0,5})'
      labels:
        - {text: "sold by", specificity: 1.0}
        - {text: "supplier name", specificity: 1.0}
        - {text: "vendor name", specificity: 1.0}
        - {text: "billed from", specificity: 0.9}
        - {text: "seller", specificity: 0.8}

  - name: buyer_name
    classes: [invoice, receipt, purchase_order]   # only run on these document classes
    type: text
    normalizer: text_norm
    strategies: [anchor]
    anchor:
      window: 90
      direction: after
      value_regex: '([A-Z][A-Za-z&.,''-]*(?:[ 	]+[A-Z][A-Za-z&.,''-]*){0,5})'
      labels:
        - {text: "bill to", specificity: 1.0}
        - {text: "billed to", specificity: 1.0}
        - {text: "customer name", specificity: 0.95}
        - {text: "ship to", specificity: 0.8}

# Options handed to the normalizers. Keeps vocabulary out of the code.
normalizer_options:
  date_iso:
    dayfirst: true          # Indian corpora are dd/mm/yyyy
  currency:
    default: INR
    lookbehind: 20          # chars before the number to sniff for a symbol
    symbols:
      "₹": INR
      "Rs.": INR
      "Rs": INR
      "INR": INR
      "$": USD
      "USD": USD
      "€": EUR
      "EUR": EUR
      "£": GBP
      "GBP": GBP
      "AED": AED
      "SGD": SGD
      "JPY": JPY

# Positional templates. Empty is fine, the strategy just never fires.
# region is [x0, y0, x1, y1] as a fraction of page size.
templates: []
