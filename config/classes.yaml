# Document taxonomy plus the rule layer that runs before the model.
#
# marker kinds:
#   regex    - pattern, case insensitive unless case_sensitive: true
#   keywords - any: [...] and/or all: [...], matched on word boundaries
# scope: first_page | header | anywhere
# specificity: how much this marker alone proves the class. >= rule_short_circuit
#              in pipeline.yaml short circuits and skips the model.
version: 1

classes:
  - name: invoice
    description: Seller issued request for payment.
    markers:
      - {kind: regex, pattern: '\btax\s+invoice\b', scope: first_page, specificity: 0.95}
      - {kind: regex, pattern: '\bproforma\s+invoice\b', scope: first_page, specificity: 0.93}
      - {kind: regex, pattern: '\binvoice\s*(?:no|number|#)\b', scope: anywhere, specificity: 0.88}
      - {kind: keywords, all: [invoice, total], any: [gstin, hsn, sac, "place of supply"], scope: anywhere, specificity: 0.85}
      - {kind: keywords, any: [invoice], scope: header, specificity: 0.6}

  - name: receipt
    description: Proof that payment was made.
    markers:
      - {kind: regex, pattern: '\b(?:payment|cash|money)\s+receipt\b', scope: first_page, specificity: 0.94}
      - {kind: regex, pattern: '\breceipt\s*(?:no|number|#)\b', scope: anywhere, specificity: 0.85}
      - {kind: keywords, all: [receipt], any: ["amount paid", "received from", "received with thanks"], scope: anywhere, specificity: 0.87}
      - {kind: keywords, any: [receipt, "thank you for your payment"], scope: header, specificity: 0.55}

  - name: bank_statement
    description: Periodic account transaction listing.
    markers:
      - {kind: regex, pattern: '\b(?:account|bank)\s+statement\b', scope: first_page, specificity: 0.95}
      - {kind: regex, pattern: '\bstatement\s+of\s+account\b', scope: first_page, specificity: 0.94}
      - {kind: keywords, all: [balance], any: [debit, credit, withdrawal, deposit], scope: anywhere, specificity: 0.7}
      - {kind: keywords, any: ["closing balance", "opening balance", "available balance"], scope: anywhere, specificity: 0.82}

  - name: salary_slip
    description: Monthly employee pay statement.
    markers:
      - {kind: regex, pattern: '\b(?:salary|pay)\s*(?:slip|sheet)\b', scope: first_page, specificity: 0.96}
      - {kind: regex, pattern: '\bpayslip\b', scope: first_page, specificity: 0.95}
      - {kind: keywords, all: ["net pay"], any: [gross, deductions, "basic pay", hra], scope: anywhere, specificity: 0.88}
      - {kind: keywords, any: ["employee id", "employee code", "pf number", uan], scope: anywhere, specificity: 0.6}

  - name: purchase_order
    description: Buyer issued order to a supplier.
    markers:
      - {kind: regex, pattern: '\bpurchase\s+order\b', scope: first_page, specificity: 0.95}
      - {kind: regex, pattern: '\bp\.?o\.?\s*(?:no|number|#)\b', scope: anywhere, specificity: 0.8}
      - {kind: keywords, all: ["purchase order"], any: ["ship to", "delivery date", "vendor"], scope: anywhere, specificity: 0.9}

  - name: id_document
    description: Government issued identity card.
    markers:
      - {kind: regex, pattern: '\bunique\s+identification\s+authority\b', scope: anywhere, specificity: 0.97}
      - {kind: regex, pattern: '\bincome\s+tax\s+department\b', scope: anywhere, specificity: 0.9}
      - {kind: regex, pattern: '\bpermanent\s+account\s+number\b', scope: anywhere, specificity: 0.93}
      - {kind: keywords, any: [aadhaar, "government of india", "date of birth"], scope: anywhere, specificity: 0.6}

  - name: contract
    description: Agreement between parties.
    markers:
      - {kind: regex, pattern: '\bthis\s+agreement\s+is\s+made\b', scope: first_page, specificity: 0.94}
      - {kind: regex, pattern: '\b(?:in\s+witness\s+whereof|hereinafter\s+referred\s+to\s+as)\b', scope: anywhere, specificity: 0.92}
      - {kind: keywords, all: [agreement], any: [whereas, "the parties", "terms and conditions", indemnity], scope: anywhere, specificity: 0.78}

  - name: tax_form
    description: Statutory tax return or certificate.
    markers:
      - {kind: regex, pattern: '\bform\s+(?:16|26as|gstr-?\d)\b', scope: anywhere, specificity: 0.95}
      - {kind: regex, pattern: '\btds\s+certificate\b', scope: anywhere, specificity: 0.93}
      - {kind: keywords, any: ["assessment year", "previous year", "tax deducted at source"], scope: anywhere, specificity: 0.75}

  - name: court_document
    description: >
      Judgment, order or tribunal decision, and anything filed in or issued by a
      court. The client files these under seven different folder names, but those
      names describe what the firm uses a document for, not what the document is.
      See taxonomy.yaml. Markers below were measured against the 46 court PDFs in
      Classification_Doc: 46/46 fire, 44/46 at or above rule_short_circuit, and
      0/26 of the business PDFs fire any of them.
    markers:
      - {kind: regex, pattern: '\bequivalent\s+citations?\s*:', scope: header, specificity: 0.96}
      - {kind: regex, pattern: '\bin\s+the\s+(?:hon.{0,4}ble\s+)?(?:supreme\s+court|high\s+court|district\s+court|court\s+of\s+\w+)', scope: first_page, specificity: 0.95}
      - {kind: regex, pattern: '\bdate\s+of\s+(?:judgment|judgement|decision|order)\b', scope: first_page, specificity: 0.92}
      - {kind: regex, pattern: '\b(?:reserved\s+on|pronounced\s+on|date\s+of\s+pronouncement)\b', scope: first_page, specificity: 0.9}
      - {kind: regex, pattern: '\b(?:coram|bench|author)\s*:', scope: header, specificity: 0.9}
      - {kind: regex, pattern: '\b(?:writ\s+petition|w\.?p\.?\s*\(\w+\)|crl\.?\s*a\.?|r\.?f\.?a\.?|c\.?r\.?p\.?)\s*(?:no\.?)?\s*\d+', scope: anywhere, specificity: 0.88}
      - {kind: regex, pattern: '\barticle\s+(?:32|136|226|227)\s+of\s+the\s+constitution', scope: anywhere, specificity: 0.88}
      # A caption naming both sides. Intrinsic, and it has to sit above the
      # contract layer's 0.92 'hereinafter referred to as', which judgments
      # quote constantly. 41/46 court PDFs, 0/26 business PDFs.
      - {kind: keywords, all: [petitioner, respondent], scope: anywhere, specificity: 0.93}
      - {kind: keywords, all: [appellant, respondent], scope: anywhere, specificity: 0.93}
      - {kind: keywords, all: [learned], any: [counsel, advocate, "senior counsel"], scope: anywhere, specificity: 0.85}
      # Provenance marker, not an intrinsic one: this is the indiankanoon.org
      # download banner. Kept low so it cannot short circuit on its own.
      - {kind: regex, pattern: '\bvs\.?\b.{0,120}\bon\s+\d{1,2}\s+\w+,\s*\d{4}', scope: header, specificity: 0.8}
      - {kind: regex, pattern: '\b(?:petitioner|appellant)s?\b', scope: first_page, specificity: 0.7}
